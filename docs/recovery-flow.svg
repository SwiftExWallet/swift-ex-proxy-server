<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">SwiftEx wallet recovery flow</title>
  <desc id="desc">Registration, recovery start, and recovery execution across the client, backend, MongoDB, zkEmail prover, and Stellar Soroban contract.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="currentColor"/></marker>
    <style>
      text{font-family:Inter,Arial,sans-serif;fill:#172554}.title{font-size:25px;font-weight:700}.phase{font-size:15px;font-weight:700}.lane{font-size:14px;font-weight:700}.node{font-size:13px}.strong{font-weight:700}.edge{fill:none;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1500" height="900" fill="#fff"/>
  <text class="title" x="750" y="35" text-anchor="middle">SwiftEx Wallet Recovery — Registration, Start and Execute</text>
  <g class="phase" text-anchor="middle">
    <rect x="155" y="55" width="420" height="38" rx="8" fill="#dbeafe" stroke="#2563eb"/><text x="365" y="80">1. REGISTRATION</text>
    <rect x="595" y="55" width="430" height="38" rx="8" fill="#ede9fe" stroke="#7c3aed"/><text x="810" y="80">2. START RECOVERY</text>
    <rect x="1045" y="55" width="430" height="38" rx="8" fill="#dcfce7" stroke="#16a34a"/><text x="1260" y="80">3. EXECUTE RECOVERY</text>
  </g>
  <g>
    <rect x="20" y="110" width="1455" height="125" fill="#f8fafc" stroke="#94a3b8"/><rect x="20" y="110" width="135" height="125" fill="#e2e8f0" stroke="#94a3b8"/><text class="lane" x="87" y="175" text-anchor="middle">CLIENT / OWNER</text>
    <rect x="20" y="235" width="1455" height="175" fill="#eff6ff" stroke="#60a5fa"/><rect x="20" y="235" width="135" height="175" fill="#dbeafe" stroke="#60a5fa"/><text class="lane" x="87" y="325" text-anchor="middle">SWIFTEX BACKEND</text>
    <rect x="20" y="410" width="1455" height="120" fill="#fff7ed" stroke="#fb923c"/><rect x="20" y="410" width="135" height="120" fill="#ffedd5" stroke="#fb923c"/><text class="lane" x="87" y="466" text-anchor="middle">MONGODB</text><text class="node" x="87" y="486" text-anchor="middle">orchestration state</text>
    <rect x="20" y="530" width="1455" height="120" fill="#faf5ff" stroke="#c084fc"/><rect x="20" y="530" width="135" height="120" fill="#f3e8ff" stroke="#c084fc"/><text class="lane" x="87" y="595" text-anchor="middle">zkEMAIL PROVER</text>
    <rect x="20" y="650" width="1455" height="210" fill="#f0fdf4" stroke="#4ade80"/><rect x="20" y="650" width="135" height="210" fill="#dcfce7" stroke="#4ade80"/><text class="lane" x="87" y="750" text-anchor="middle">STELLAR / SOROBAN</text><text class="node" x="87" y="770" text-anchor="middle">contract authority</text>
  </g>
  <!-- Connections are behind opaque nodes so long cross-lane routes stay readable. -->
  <g class="edge">
    <path d="M247 200V250H330V275" stroke="#2563eb" color="#2563eb"/><path d="M420 307H482V200" stroke="#2563eb" color="#2563eb"/><path d="M482 200V680H475V700" stroke="#2563eb" color="#2563eb"/><path d="M575 732H600V365H542V340" stroke="#2563eb" color="#2563eb"/><path d="M542 340V440" stroke="#2563eb" color="#2563eb"/>
    <path d="M707 200V270" stroke="#7c3aed" color="#7c3aed"/><path d="M700 335V440" stroke="#7c3aed" color="#7c3aed"/><path d="M760 335V545H825V560" stroke="#7c3aed" color="#7c3aed"/><path d="M925 590H940V335" stroke="#7c3aed" color="#7c3aed"/><path d="M940 335V695" stroke="#7c3aed" color="#7c3aed"/><path d="M945 695V520H960V500" stroke="#7c3aed" color="#7c3aed"/>
    <path d="M1152 200V270" stroke="#16a34a" color="#16a34a"/><path d="M1240 302H1280" stroke="#16a34a" color="#16a34a"/><path d="M1362 335V675H1337V695" stroke="#16a34a" color="#16a34a"/><path d="M1337 695V520H1367V500" stroke="#16a34a" color="#16a34a"/><path d="M1367 435V220H1397V200" stroke="#16a34a" color="#16a34a"/>
  </g>
  <g class="node" text-anchor="middle">
    <g><rect x="175" y="140" width="145" height="60" rx="8" fill="#fff" stroke="#2563eb"/><text x="247" y="165">POST /registration/prepare</text><text x="247" y="184">email + assets</text></g>
    <g><rect x="405" y="140" width="155" height="60" rx="8" fill="#dbeafe" stroke="#2563eb"/><text class="strong" x="482" y="165">Owner signs + submits</text><text x="482" y="184">unsigned XDR</text></g>
    <g><rect x="240" y="275" width="180" height="65" rx="8" fill="#fff" stroke="#2563eb"/><text x="330" y="301">Validate policy; prepare</text><text x="330" y="321">register_and_approve XDR</text></g>
    <g><rect x="450" y="275" width="185" height="65" rx="8" fill="#fff" stroke="#2563eb"/><text x="542" y="301">POST /registration/confirm</text><text x="542" y="321">Verify SUCCESS + commitment</text></g>
    <g><rect x="455" y="440" width="165" height="55" rx="8" fill="#fff7ed" stroke="#ea580c"/><text x="537" y="464">Upsert registration</text><text x="537" y="483">metadata</text></g>
    <g><rect x="375" y="700" width="200" height="65" rx="8" fill="#dcfce7" stroke="#16a34a"/><text x="475" y="727">register_and_approve</text><text x="475" y="747">Commitment + allowances</text></g>

    <g><rect x="625" y="140" width="165" height="60" rx="8" fill="#fff" stroke="#7c3aed"/><text x="707" y="165">POST /start with .eml</text><text x="707" y="184">or SES/SNS hook</text></g>
    <g><rect x="625" y="270" width="180" height="65" rx="8" fill="#fff" stroke="#7c3aed"/><text x="715" y="296">Validate owner/email;</text><text x="715" y="316">read on-chain pending</text></g>
    <g><rect x="850" y="270" width="180" height="65" rx="8" fill="#ede9fe" stroke="#7c3aed"/><text x="940" y="296">Preview destination; keeper</text><text class="strong" x="940" y="316">signs start_recovery</text></g>
    <g><rect x="630" y="435" width="165" height="65" rx="8" fill="#fff7ed" stroke="#ea580c"/><text x="712" y="461">Clear stale active;</text><text x="712" y="481">create STARTED</text></g>
    <g><rect x="870" y="435" width="180" height="65" rx="8" fill="#fff7ed" stroke="#ea580c"/><text x="960" y="461">Persist PENDING + unlockAt</text><text x="960" y="481">Failure → FAILED</text></g>
    <g><rect x="725" y="560" width="200" height="60" rx="8" fill="#faf5ff" stroke="#9333ea"/><text x="825" y="585">Generate proof from DKIM email</text><text x="825" y="604">+ on-chain salt</text></g>
    <g><rect x="835" y="695" width="220" height="70" rx="8" fill="#dcfce7" stroke="#16a34a"/><text class="strong" x="945" y="720">SpareKey verifies proof</text><text x="945" y="740">Stores destination, nullifier,</text><text x="945" y="758">and unlock time</text></g>

    <g><rect x="1080" y="140" width="145" height="60" rx="8" fill="#fff" stroke="#16a34a"/><text x="1152" y="165">Poll status, then</text><text x="1152" y="184">POST /execute</text></g>
    <g><rect x="1330" y="140" width="135" height="60" rx="8" fill="#fff" stroke="#16a34a"/><text x="1397" y="165">Return tx hash or</text><text x="1397" y="184">contract rejection</text></g>
    <g><rect x="1075" y="270" width="165" height="65" rx="8" fill="#fff" stroke="#16a34a"/><text x="1157" y="296">Require local PENDING;</text><text x="1157" y="316">set EXECUTING</text></g>
    <g><rect x="1280" y="270" width="165" height="65" rx="8" fill="#dcfce7" stroke="#16a34a"/><text class="strong" x="1362" y="296">Keeper signs</text><text x="1362" y="316">execute_recovery</text></g>
    <g><rect x="1280" y="435" width="175" height="65" rx="8" fill="#fff7ed" stroke="#ea580c"/><text x="1367" y="461">Success → COMPLETED</text><text x="1367" y="481">Rejection → FAILED</text></g>
    <g><rect x="1225" y="695" width="225" height="70" rx="8" fill="#dcfce7" stroke="#16a34a"/><text class="strong" x="1337" y="720">Contract enforces unlock</text><text x="1337" y="740">readiness and executes</text><text x="1337" y="758">asset recovery</text></g>
  </g>
  <g class="node"><rect x="175" y="815" width="640" height="28" rx="6" fill="#dbeafe"/><text x="190" y="834"><tspan class="strong">Signer boundary:</tspan> owner signs registration; backend keeper signs recovery transactions.</text><rect x="835" y="815" width="615" height="28" rx="6" fill="#dcfce7"/><text x="850" y="834"><tspan class="strong">Authority boundary:</tspan> Mongo tracks workflow; the contract validates proof and unlock time.</text></g>
</svg>
